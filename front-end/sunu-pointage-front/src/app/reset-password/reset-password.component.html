<div class="reset-password-container">
    <h2>Réinitialisation du mot de passe</h2>
    <p class="description">
      Veuillez entrer votre nouveau mot de passe pour finaliser la réinitialisation.
    </p>
  
    <form (ngSubmit)="onSubmit()" class="reset-password-form">
      <!-- Nouveau mot de passe -->
      <div class="form-group">
        <label for="newPassword">Nouveau mot de passe</label>
        <input
          type="password"
          id="newPassword"
          [(ngModel)]="newPassword"
          name="newPassword"
          required
          minlength="8"
          class="form-control"
          placeholder="Entrez un nouveau mot de passe"
        />
      </div>
  
      <!-- Bouton de soumission -->
      <button type="submit" class="btn btn-primary" [disabled]="!newPassword">
        Réinitialiser
      </button>
  
      <!-- Messages -->
      <div class="message success" *ngIf="message">{{ message }}</div>
      <div class="message error" *ngIf="error">{{ error }}</div>
    </form>
  </div>
